  <text x="80" y="138" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700">Muhammad Khuzaima</text>
  <text x="80" y="176" fill="#CBD5E1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">Full-Stack and Cross-Platform Mobile Developer</text>
  <text x="80" y="212" fill="#67E8F9" font-family="Consolas, Menlo, monospace" font-size="14">React Native  |  Flutter  |  TypeScript  |  Laravel</text>

